{% load static %}<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
    <script>
        // Apply a saved light/dark choice before first paint so the page never flashes.
        document.documentElement.classList.add('js');
        try {
            var saved = localStorage.getItem('theme');
            if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
        } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=3.0">
    <link rel="icon" type="image/png" href="{% static 'images/logo_circle.png' %}">
    <script src="{% static 'js/theme.js' %}?v=3.0" defer></script>
