name: engineericly

# Deploy from a clone of this repo on the VM, with a .env next to this file
# (see .env.example), then run `make deploy`.
# Point the VM's nginx at http://127.0.0.1:9192.
#
# Everything the app keeps lives in ${DATA_DIR} (default ./data next to this file):
#   db.sqlite3
#   vol/static   collected CSS/JS/images (rebuilt on every start)
#   vol/media    uploaded covers — back this folder and the database up

services:
  web:
    # Built on the server from this checkout: `make deploy` (git pull + rebuild).
    build: .
    image: engineericly:latest
    container_name: engineericly_web
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    ports:
      # Only reachable from the VM itself; set BIND_ADDRESS=0.0.0.0 if nginx runs elsewhere.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-9192}:8000"
    restart: unless-stopped
